<body>
    <div class="curtain" id="curtain"></div>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-dot" id="cursorDot"></div>

    <div class="settings-panel" id="settingsPanel">
        <button class="settings-toggle" id="settingsToggle" aria-label="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
        <div class="settings-content">
            <h4>Motion Settings</h4>
            <label class="setting-item"><span>Page Curtain</span><input type="checkbox" id="toggleCurtain" checked></label>
            <label class="setting-item"><span>Smooth Scroll</span><input type="checkbox" id="toggleSmooth" checked></label>
            <label class="setting-item"><span>Text Reveals</span><input type="checkbox" id="toggleReveals" checked></label>
            <label class="setting-item"><span>Custom Cursor</span><input type="checkbox" id="toggleCursor" checked></label>
            <label class="setting-item"><span>Magnetic Buttons</span><input type="checkbox" id="toggleMagnetic" checked></label>
        </div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo magnetic">PORTFOLIO</a>
            <ul class="nav-links">
                <li><a href="index.html" class="magnetic">Home</a></li>
                <li><a href="work.html" class="magnetic">Work</a></li>
                <li><a href="journal.html" class="magnetic">Journal</a></li>
                <li><a href="contact.html" class="magnetic">Contact</a></li>
            </ul>
            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <article class="case-study" id="caseStudy">
        <div class="container">
            <a href="work.html" class="back-link magnetic">&larr; Back to Work</a>
            <div id="caseStudyContent"></div>
        </div>
    </article>

    <!-- Next Project -->

                <span class="next-arrow">&rarr;</span>

    <footer class="footer">

            <div class="footer-grid">
                <div>
                    <a href="index.html" class="logo">PORTFOLIO</a>
                    <p>Digital designer & developer</p>
                </div>
                <div class="footer-links">
                    <a href="work.html">Work</a>
                    <a href="journal.html">Journal</a>
                    <a href="contact.html">Contact</a>
                </div>
                <div class="footer-social">
                    <a href="#" class="magnetic">GitHub</a>
                    <a href="#" class="magnetic">LinkedIn</a>
                    <a href="#" class="magnetic">Twitter</a>
                </div>
            </div>
            <p class="footer-copy">&copy; 2026 Portfolio. All rights reserved.</p>
        </div>
