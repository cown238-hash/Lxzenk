<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal — LXZENK</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">L</span>
                LXZENK
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="work.html">Work</a></li>
                <li><a href="journal.html" class="active">Journal</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <div class="section-header">
                <h2><span class="icon">◆</span> Journal</h2>
            </div>

            <!-- Featured Post -->
            <div id="featuredPost" style="margin-bottom: 32px;"></div>

            <!-- Filters -->
            <div style="display: flex; gap: 8px; margin-bottom: 24px;" id="journalFilters">
                <button class="btn btn-secondary active" data-filter="all" style="padding: 6px 14px; font-size: 0.8rem;">All</button>
                <button class="btn btn-secondary" data-filter="design" style="padding: 6px 14px; font-size: 0.8rem;">Design</button>
                <button class="btn btn-secondary" data-filter="dev" style="padding: 6px 14px; font-size: 0.8rem;">Development</button>
                <button class="btn btn-secondary" data-filter="thoughts" style="padding: 6px 14px; font-size: 0.8rem;">Thoughts</button>
            </div>

            <div class="journal-grid" id="journalGrid"></div>
        </div>
    </section>

    <!-- Newsletter -->
    <section class="section" style="padding-top: 0;">
        <div class="container">
            <div class="contact-form" style="max-width: 500px; margin: 0 auto; text-align: center;">
                <h3 style="margin-bottom: 8px;">Stay in the loop</h3>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px;">Get notified about new articles and projects.</p>
                <form id="newsletterForm" style="display: flex; gap: 8px;">
                    <input type="email" placeholder="your@email.com" required style="flex: 1;">
                    <button type="submit" class="btn btn-primary">Subscribe</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-copy">© 2026 LXZENK</div>
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="work.html">Work</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
